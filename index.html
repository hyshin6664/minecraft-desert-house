<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>윤오의 마인크래프트 건축 도면 100</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Malgun Gothic","맑은 고딕",system-ui,sans-serif;background:#13161d;color:#e8e3d8;min-height:100vh}
.wrap{max-width:1240px;margin:0 auto;padding:16px 14px 70px}

h1{font-size:clamp(24px,4vw,42px);font-weight:900;color:#ffd24a;letter-spacing:-1px;line-height:1.15;text-shadow:3px 3px 0 #000}
.sub{font-size:clamp(13px,1.7vw,17px);color:#9fb0c0;font-weight:700;margin-top:6px}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:12px}
.cube0{width:62px;height:62px;flex:0 0 auto}

.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:8px;margin:14px 0 16px}
.cat{font-family:inherit;font-size:14px;font-weight:900;padding:12px 6px;border:2px solid #3a4454;border-radius:12px;cursor:pointer;background:#1c2230;color:#cfd8e3;transition:.15s;text-align:center;line-height:1.3}
.cat .ic{font-size:22px;display:block;margin-bottom:3px}
.cat .ct{font-size:11px;color:#7d8da0;font-weight:700}
.cat:hover{border-color:#ffd24a;transform:translateY(-2px)}
.cat.on{background:linear-gradient(180deg,#ffd24a,#f0a92a);color:#1a1200;border-color:#fff3c4}
.cat.on .ct{color:#5a4200}

.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.bar h2{font-size:clamp(19px,2.6vw,27px);color:#ffd24a;font-weight:900}
.bar .desc{font-size:14px;color:#9fb0c0;font-weight:600}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px}
.item{background:#1c2230;border:2px solid #333e4f;border-radius:14px;padding:10px;cursor:pointer;transition:.15s;text-align:center}
.item:hover{border-color:#ffd24a;transform:translateY(-3px);box-shadow:0 8px 20px rgba(0,0,0,.5)}
.item .th{height:112px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.item .nm{font-size:13.5px;font-weight:900;color:#f0e9dc;margin-top:6px;line-height:1.3}
.item .sz{font-size:11.5px;color:#8fa0b2;margin-top:3px;font-weight:700}
.stars{color:#ffd24a;font-size:12px;letter-spacing:1px;margin-top:3px}

.modal{position:fixed;inset:0;background:rgba(5,7,12,.88);z-index:90;display:none;overflow:auto;padding:18px}
.modal.on{display:block}
.sheet{max-width:1100px;margin:0 auto;background:#1a2029;border:3px solid #ffd24a;border-radius:18px;padding:18px}
.sheet h3{font-size:clamp(20px,3vw,30px);color:#ffd24a;font-weight:900}
.sheet .meta{font-size:14px;color:#9fb0c0;font-weight:700;margin-top:4px}
.close{float:right;font-family:inherit;font-size:15px;font-weight:900;background:#ffd24a;color:#1a1200;border:none;border-radius:10px;padding:8px 18px;cursor:pointer}
.panes{display:flex;gap:16px;flex-wrap:wrap;margin-top:14px;align-items:flex-start}
.pane{flex:1 1 320px;min-width:290px;background:#121720;border:2px solid #333e4f;border-radius:14px;padding:12px}
.pane .pt{font-size:14px;font-weight:900;color:#ffd24a;text-align:center;margin-bottom:8px}
.floors{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.fl{background:#121720;border:2px solid #333e4f;border-radius:12px;padding:8px}
.fl .ft{font-size:12.5px;font-weight:900;color:#9fd0e8;text-align:center;margin-bottom:5px}
.mats{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.mt{display:flex;align-items:center;gap:5px;background:#121720;border:1.5px solid #3a4454;border-radius:8px;padding:5px 9px;font-size:12px;font-weight:700;color:#cfd8e3}
.mt i{width:13px;height:13px;border-radius:3px;display:inline-block;border:1px solid rgba(0,0,0,.4)}
.tipbox{margin-top:12px;background:#15202b;border-left:5px solid #ffd24a;border-radius:8px;padding:10px 12px;font-size:13.5px;color:#d7e2ea;font-weight:600;line-height:1.55}
.tipbox b{color:#ffd24a}
footer{text-align:center;color:#6b7a8c;font-weight:800;font-size:13px;padding:18px 0 0}
.hint{font-size:13px;color:#8fa0b2;font-weight:700;margin-bottom:10px}

@media (max-width:640px){
  .grid{grid-template-columns:repeat(auto-fill,minmax(136px,1fr))}
  .item .th{height:92px}
  .sheet{padding:12px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <svg class="cube0" viewBox="0 0 80 80"><path d="M40 8l26 14-26 14-26-14z" fill="#ffd24a"/><path d="M14 22v30l26 14V36z" fill="#c99a1e"/><path d="M66 22v30L40 66V36z" fill="#9c7616"/></svg>
    <div>
      <h1>윤오의 마인크래프트 건축 도면 100</h1>
      <div class="sub">크리에이티브 모드 · 종류별로 묶은 도면 100개 · 눌러서 자세히 보기</div>
    </div>
  </div>

  <div class="cats" id="cats"></div>
  <div class="bar"><h2 id="catName"></h2><span class="desc" id="catDesc"></span></div>
  <div class="hint">건물을 누르면 <b>층별 도면</b>과 <b>완성한 모습</b>이 크게 나와요.</div>
  <div class="grid" id="grid"></div>
  <footer>아빠가 윤오를 위해 만든 건축 도면집 🧱</footer>
</div>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>

<script>
/* ===================== 블록 팔레트 ===================== */
var B = {
  st:['#8f8f8f','돌'], cb:['#7d7d7d','조약돌'], sb:['#9d9d9d','석재 벽돌'], dp:['#4a4a4e','심층암'],
  bs:['#2e2b31','블랙스톤'], an:['#a8a8a8','안산암'], gr:['#a0715f','화강암'], di:['#d6d6d6','섬록암'],
  sa:['#e3d3a2','사암'], rs:['#b5612f','붉은 사암'], sm:['#efe3b4','매끄러운 사암'],
  oak:['#b0822f','참나무'], spr:['#6b4a24','가문비나무'], bir:['#e4d5a3','자작나무'],
  dok:['#4a3317','짙은 참나무'], aca:['#c06a35','아카시아'], che:['#efb8c8','벚나무'], bam:['#c6b14b','대나무'],
  gol:['#f6d33c','금 블록'], dia:['#5ce5e1','다이아 블록'], eme:['#3ad66f','에메랄드'],
  lap:['#2d55bd','청금석'], red:['#c0392b','레드스톤'], net:['#4a3f44','네더라이트'], ame:['#a06ad4','자수정'],
  qz:['#ece9e2','석영'], pri:['#67b6a8','프리즈머린'], dpr:['#2f6f63','어두운 프리즈머린'],
  lan:['#b7e6d8','바다 랜턴'], glo:['#f5d97a','발광석'], cry:['#3d1b6b','빛나는 흑요석'],
  cop:['#c1714b','구리'], oxc:['#4fab8e','산화 구리'],
  cw:['#d6ddde','흰 콘크리트'], cr:['#8f2121','빨강 콘크리트'], cbl:['#2c3b8f','파랑 콘크리트'],
  cg:['#4f6b22','초록 콘크리트'], cy:['#efc02a','노랑 콘크리트'], ck:['#121316','검정 콘크리트'],
  cp:['#6a2fa0','보라 콘크리트'], co:['#e06a12','주황 콘크리트'],
  gl:['#bfe6f2','유리'], tg:['#9fd0e8','색유리'],
  obs:['#15121f','흑요석'], hon:['#e5a53a','벌꿀 블록'], bon:['#e3ded0','뼈 블록'],
  sno:['#f0f6f8','눈 블록'], ice:['#a6d8f0','얼음'], nb:['#2d1619','네더 벽돌'],
  lea:['#4f7a2a','잎'], wat:['#2f7fe0','물'], lav:['#e8622a','용암'], sand:['#efe3b4','모래'],
  dirt:['#6b4f2a','흙'], gra:['#5a8f3a','잔디'], tor:['#ffd24a','횃불'], door:['#a9793c','문'],
  fen:['#8a6a3a','울타리'], car:['#d94f3d','카펫'], bk:['#9c5b4a','벽돌'], mud:['#6e5a4a','진흙 벽돌'],
  cal:['#e8e2d4','방해석'], tuf:['#6b6b63','응회암'], mos:['#5f7a3a','이끼 블록'], pod:['#6b4a2a','조균토']
};
function shade(hex, f) {
  var n = parseInt(hex.slice(1), 16);
  var r = Math.min(255, Math.round(((n >> 16) & 255) * f));
  var g = Math.min(255, Math.round(((n >> 8) & 255) * f));
  var b = Math.min(255, Math.round((n & 255) * f));
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}

/* ===================== 입체 그림 ===================== */
function cull(bl) {
  var m = {};
  bl.forEach(function (b) { m[b[0] + ',' + b[1] + ',' + b[2]] = 1; });
  return bl.filter(function (b) {
    return !(m[(b[0] + 1) + ',' + b[1] + ',' + b[2]] && m[b[0] + ',' + (b[1] + 1) + ',' + b[2]] && m[b[0] + ',' + b[1] + ',' + (b[2] + 1)]);
  });
}
function iso(bl, o) {
  o = o || {}; var W = o.w || 14, H = W / 2, HH = o.hh || W * 0.78;
  bl = cull(bl);
  var minx = 1e9, maxx = -1e9, miny = 1e9, maxy = -1e9, it = [];
  bl.forEach(function (b) {
    var sx = (b[0] - b[2]) * W / 2, sy = (b[0] + b[2]) * H / 2 - b[1] * HH;
    if (sx - W / 2 < minx) minx = sx - W / 2;
    if (sx + W / 2 > maxx) maxx = sx + W / 2;
    if (sy < miny) miny = sy;
    if (sy + H + HH > maxy) maxy = sy + H + HH;
    it.push([sx, sy, b[0] + b[2] + b[1] * 0.5, b[3]]);
  });
  it.sort(function (a, b) { return a[2] - b[2]; });
  var pad = 10, vw = (maxx - minx) + pad * 2, vh = (maxy - miny) + pad * 2;
  var ox = -minx + pad, oy = -miny + pad;
  var s = ['<svg viewBox="0 0 ' + vw.toFixed(1) + ' ' + vh.toFixed(1) + '" style="width:100%;height:auto;max-height:' + (o.max || 460) + 'px;display:block" xmlns="http://www.w3.org/2000/svg">'];
  var sw = W < 9 ? 0 : 0.6;
  it.forEach(function (t) {
    var c = (B[t[3]] || B.st)[0], x = t[0] + ox, y = t[1] + oy;
    var op = (t[3] === 'gl' || t[3] === 'tg' || t[3] === 'ice') ? ' opacity=".6"' : '';
    var stk = sw ? ' stroke="rgba(0,0,0,.35)" stroke-width="' + sw + '"' : '';
    s.push('<path d="M' + x.toFixed(1) + ' ' + y.toFixed(1) + 'l' + (W / 2) + ' ' + (H / 2) + 'l' + (-W / 2) + ' ' + (H / 2) + 'l' + (-W / 2) + ' ' + (-H / 2) + 'z" fill="' + shade(c, 1.15) + '"' + stk + op + '/>');
    s.push('<path d="M' + (x - W / 2).toFixed(1) + ' ' + (y + H / 2).toFixed(1) + 'l0 ' + HH.toFixed(1) + 'l' + (W / 2) + ' ' + (H / 2) + 'l0 ' + (-HH).toFixed(1) + 'z" fill="' + shade(c, .8) + '"' + stk + op + '/>');
    s.push('<path d="M' + (x + W / 2).toFixed(1) + ' ' + (y + H / 2).toFixed(1) + 'l0 ' + HH.toFixed(1) + 'l' + (-W / 2) + ' ' + (H / 2) + 'l0 ' + (-HH).toFixed(1) + 'z" fill="' + shade(c, .58) + '"' + stk + op + '/>');
  });
  return s.join('') + '</svg>';
}

/* ===================== 층별 도면 ===================== */
function planAt(bl, y, cell) {
  cell = cell || 15;
  var minx = 1e9, maxx = -1e9, minz = 1e9, maxz = -1e9, has = false;
  bl.forEach(function (b) {
    if (b[1] !== y) return; has = true;
    if (b[0] < minx) minx = b[0]; if (b[0] > maxx) maxx = b[0];
    if (b[2] < minz) minz = b[2]; if (b[2] > maxz) maxz = b[2];
  });
  if (!has) return '';
  var w = (maxx - minx + 1) * cell, h = (maxz - minz + 1) * cell;
  var s = ['<svg viewBox="-1 -1 ' + (w + 2) + ' ' + (h + 2) + '" style="width:100%;height:auto;max-height:300px;display:block" xmlns="http://www.w3.org/2000/svg">'];
  s.push('<rect x="-1" y="-1" width="' + (w + 2) + '" height="' + (h + 2) + '" fill="#0d1117"/>');
  bl.forEach(function (b) {
    if (b[1] !== y) return;
    var c = (B[b[3]] || B.st)[0];
    var px = (b[0] - minx) * cell, py = (b[2] - minz) * cell;
    s.push('<rect x="' + px + '" y="' + py + '" width="' + cell + '" height="' + cell + '" fill="' + c + '" stroke="rgba(0,0,0,.45)" stroke-width=".8"/>');
    if (b[3] === 'door') s.push('<circle cx="' + (px + cell * .72) + '" cy="' + (py + cell / 2) + '" r="' + (cell * .1) + '" fill="#4a2f12"/>');
    if (b[3] === 'tor' || b[3] === 'glo' || b[3] === 'lan') s.push('<circle cx="' + (px + cell / 2) + '" cy="' + (py + cell / 2) + '" r="' + (cell * .3) + '" fill="#fff6c8" opacity=".75"/>');
    if (b[3] === 'gl' || b[3] === 'tg') s.push('<path d="M' + px + ' ' + (py + cell) + 'L' + (px + cell) + ' ' + py + '" stroke="#fff" stroke-width="1.2" opacity=".75"/>');
  });
  // 격자 10칸마다 굵은 선
  for (var gx = 0; gx <= (maxx - minx + 1); gx += 5) s.push('<line x1="' + gx * cell + '" y1="0" x2="' + gx * cell + '" y2="' + h + '" stroke="#ffd24a" stroke-width=".8" opacity=".45"/>');
  for (var gz = 0; gz <= (maxz - minz + 1); gz += 5) s.push('<line x1="0" y1="' + gz * cell + '" x2="' + w + '" y2="' + gz * cell + '" stroke="#ffd24a" stroke-width=".8" opacity=".45"/>');
  return s.join('') + '</svg>';
}

/* ===================== 건물 생성기 ===================== */
function ring(bl, x0, z0, w, d, y, t) {
  for (var i = 0; i < w; i++) for (var j = 0; j < d; j++)
    if (i === 0 || i === w - 1 || j === 0 || j === d - 1) bl.push([x0 + i, y, z0 + j, t]);
}
function slab(bl, x0, z0, w, d, y, t) {
  for (var i = 0; i < w; i++) for (var j = 0; j < d; j++) bl.push([x0 + i, y, z0 + j, t]);
}
function pillar(bl, x, z, y0, y1, t) { for (var y = y0; y <= y1; y++) bl.push([x, y, z, t]); }

/* 집 — s: [이름,w,d,층수,벽,강조,지붕,창,난이도,팁] */
function genHouse(s) {
  var w = s[1], d = s[2], f = s[3], wall = s[4], acc = s[5], roof = s[6], win = s[7];
  var bl = [], fh = 4, i, j, y, lvl;
  slab(bl, 0, 0, w, d, 0, acc);
  for (lvl = 0; lvl < f; lvl++) {
    var base = lvl * fh;
    for (y = base + 1; y <= base + fh; y++) {
      for (i = 0; i < w; i++) for (j = 0; j < d; j++) {
        if (!(i === 0 || i === w - 1 || j === 0 || j === d - 1)) continue;
        var t = wall;
        if (y === base + fh) t = acc;                      // 층 띠
        if (i === 0 || i === w - 1) { if ((j + lvl) % 2 === 0 && y === base + 2) t = acc; }
        var isWin = false;
        if (win === 'band' && (y === base + 2 || y === base + 3)) isWin = (i % 2 === 1 && j % 2 === 1) || (i > 0 && i < w - 1 && j % 3 === 1) || (j > 0 && j < d - 1 && i % 3 === 1);
        if (win === 'grid' && (y === base + 2) && ((i % 3 === 1) || (j % 3 === 1))) isWin = true;
        if (win === 'arch' && (y === base + 2 || y === base + 3) && ((i % 4 === 2) || (j % 4 === 2))) isWin = true;
        if (win === 'wide' && y === base + 3 && i > 0 && i < w - 1) isWin = true;
        if (isWin) t = 'gl';
        if (lvl === 0 && j === d - 1 && i === Math.floor(w / 2) && y <= 2) t = 'door';
        bl.push([i, y, j, t]);
      }
      if (lvl > 0 && y === base + 1) slab(bl, 1, 1, w - 2, d - 2, y - 1, acc);  // 층 바닥
    }
  }
  var top = f * fh + 1;
  if (roof === 'flat') { slab(bl, -1, -1, w + 2, d + 2, top, acc); ring(bl, -1, -1, w + 2, d + 2, top + 1, wall); }
  else if (roof === 'pyr') {
    var k = 0;
    while (w - k * 2 > 0 && d - k * 2 > 0) { slab(bl, k - 1, k - 1, w - k * 2 + 2, d - k * 2 + 2, top + k, acc); k++; }
  } else if (roof === 'stair') {
    slab(bl, -1, -1, w + 2, d + 2, top, acc);
    slab(bl, 1, 1, w - 2, d - 2, top + 1, acc);
    slab(bl, 2, 2, w - 4, d - 4, top + 2, wall);
  } else if (roof === 'dome') {
    var cx = (w - 1) / 2, cz = (d - 1) / 2, R = Math.min(w, d) / 2;
    for (var yy = 0; yy <= R; yy++) {
      var r = Math.sqrt(Math.max(0, R * R - yy * yy));
      for (i = -R - 1; i <= R + 1; i++) for (j = -R - 1; j <= R + 1; j++) {
        var dd = Math.sqrt(i * i + j * j);
        if (dd <= r && dd > r - 1.35) bl.push([Math.round(cx + i), top + yy, Math.round(cz + j), acc]);
      }
    }
  } else if (roof === 'gable') {
    for (var g = 0; g < Math.ceil(d / 2); g++) {
      for (i = -1; i <= w; i++) { bl.push([i, top + g, g - 1, acc]); bl.push([i, top + g, d - g, acc]); }
    }
  }
  // 장식
  bl.push([-1, 2, 1, 'tor']); bl.push([w, 2, d - 2, 'tor']);
  if (s[10]) s[10](bl, w, d, f * fh);
  return bl;
}

/* 성 */
function genCastle(s) {
  var w = s[1], d = s[2], h = s[3], wall = s[4], acc = s[5], style = s[6];
  var bl = [], i, j, y;
  slab(bl, 0, 0, w, d, 0, acc);
  for (y = 1; y <= h; y++) ring(bl, 0, 0, w, d, y, wall);
  // 흉벽
  for (i = 0; i < w; i++) for (j = 0; j < d; j++) {
    if (!(i === 0 || i === w - 1 || j === 0 || j === d - 1)) continue;
    if ((i + j) % 2 === 0) bl.push([i, h + 1, j, acc]);
  }
  // 모서리 탑 4개
  var th = h + 5, tr = 3;
  [[0, 0], [w - 1, 0], [0, d - 1], [w - 1, d - 1]].forEach(function (c) {
    for (y = 1; y <= th; y++) for (i = -tr; i <= tr; i++) for (j = -tr; j <= tr; j++) {
      var dd = Math.sqrt(i * i + j * j);
      if (dd > tr || dd < tr - 1.3) continue;
      bl.push([c[0] + i, y, c[1] + j, (y % 4 === 0) ? acc : wall]);
    }
    for (i = -tr - 1; i <= tr + 1; i++) for (j = -tr - 1; j <= tr + 1; j++) {
      if (Math.sqrt(i * i + j * j) > tr + 1) continue;
      bl.push([c[0] + i, th + 1, c[1] + j, acc]);
    }
    if (style === 'cone') {
      for (var k = 1; k <= tr + 1; k++) for (i = -tr - 1 + k; i <= tr + 1 - k; i++) for (j = -tr - 1 + k; j <= tr + 1 - k; j++) {
        if (Math.sqrt(i * i + j * j) > tr + 1 - k) continue;
        bl.push([c[0] + i, th + 1 + k, c[1] + j, s[7]]);
      }
    } else {
      for (i = -tr - 1; i <= tr + 1; i += 2) { bl.push([c[0] + i, th + 2, c[1] - tr - 1, acc]); bl.push([c[0] + i, th + 2, c[1] + tr + 1, acc]); }
    }
    bl.push([c[0], th + (style === 'cone' ? tr + 3 : 3), c[1], 'glo']);
  });
  // 성문
  var gx = Math.floor(w / 2);
  for (i = -1; i <= 1; i++) for (y = 1; y <= 3; y++) {

      bl.push([i, 3, -half, m2]); bl.push([i, 3, half, m2]);
    }
    pillar(bl, 8, 0, 4, 16, m2); pillar(bl, 16, 0, 4, 13, m2);
    for (y = 7; y <= 15; y++) for (j = -3; j <= 3; j++) bl.push([8, y, j, m3]);
    for (y = 7; y <= 12; y++) for (j = -2; j <= 2; j++) bl.push([16, y, j, m3]);
    bl.push([8, 17, 0, 'glo']);
  } else if (kind === 'obs') {        // 천문대
    for (i = -8; i <= 8; i++) for (j = -8; j <= 8; j++) if (Math.sqrt(i * i + j * j) <= 8) bl.push([i, 0, j, m2]);
    for (y = 1; y <= 10; y++) for (i = -6; i <= 6; i++) for (j = -6; j <= 6; j++) {
      var d4 = Math.sqrt(i * i + j * j);
      if (d4 > 6 || d4 < 4.8) continue;
      bl.push([i, y, j, (y % 5 === 0) ? m1 : m2]);
    }
    for (k = 0; k <= 6; k++) {
      var rr2 = Math.sqrt(Math.max(0, 36 - k * k * 1.4));
      for (i = -7; i <= 7; i++) for (j = -7; j <= 7; j++) {
        var d5 = Math.sqrt(i * i + j * j);
        if (d5 > rr2 || d5 < rr2 - 1.3) continue;
        bl.push([i, 11 + k, j, (i > 1 && Math.abs(j) < 2) ? 'gl' : m1]);
      }
    }
    bl.push([0, 18, 0, 'lan']);
  } else if (kind === 'nether') {     // 네더 요새풍
    for (i = 0; i < 20; i++) for (j = 0; j < 5; j++) bl.push([i, 8, j, m1]);
    for (i = 0; i < 20; i += 1) { bl.push([i, 9, 0, m1]); bl.push([i, 9, 4, m1]); }
    for (i = 0; i < 20; i += 5) for (y = 0; y <= 7; y++) { bl.push([i, y, 0, m1]); bl.push([i, y, 4, m1]); }
    for (i = 4; i < 12; i++) for (j = 0; j < 5; j++) for (y = 10; y <= 14; y++) {
      if (!(i === 4 || i === 11 || j === 0 || j === 4)) continue;
      bl.push([i, y, j, (y === 14) ? m2 : m1]);
    }
    for (i = 3; i <= 12; i++) bl.push([i, 15, 2, m3]);
    bl.push([7, 16, 2, 'glo']);
  }
  return bl;
}

/* ===================== 화면 ===================== */
var cur = 0, catsEl = document.getElementById('cats'), gridEl = document.getElementById('grid');
var cache = {};
function blocksOf(cat, idx) {
  var k = cat + ':' + idx;
  if (!cache[k]) { var it = CATS[cat].items[idx]; cache[k] = it.g(it.s); }
  return cache[k];
}
function stars(n) { return '★★★★★'.slice(0, n) + '☆☆☆☆☆'.slice(0, 5 - n); }

CATS.forEach(function (c, i) {
  var b = document.createElement('button');
  b.className = 'cat' + (i === 0 ? ' on' : '');
  b.innerHTML = '<span class="ic">' + c.ic + '</span>' + c.name + '<span class="ct">' + c.items.length + '개</span>';
  b.onclick = function () { cur = i; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); };
  catsEl.appendChild(b);
});

function render() {
  document.querySelectorAll('.cat').forEach(function (x, j) { x.classList.toggle('on', j === cur); });
  var c = CATS[cur];
  document.getElementById('catName').textContent = c.ic + ' ' + c.name;
  document.getElementById('catDesc').textContent = c.desc;
  gridEl.innerHTML = c.items.map(function (it, idx) {
    return '<div class="item" data-i="' + idx + '"><div class="th">' + iso(blocksOf(cur, idx), { w: 5.2, hh: 4.2, max: 112 }) +
      '</div><div class="nm">' + it.n + '</div><div class="sz">' + it.sz + '</div><div class="stars">' + stars(it.lv) + '</div></div>';
  }).join('');
  gridEl.querySelectorAll('.item').forEach(function (el) {
    el.onclick = function () { open(cur, +el.dataset.i); };
  });
}

function open(ci, ii) {
  var it = CATS[ci].items[ii], bl = blocksOf(ci, ii);
  var ys = {}; bl.forEach(function (b) { ys[b[1]] = 1; });
  var keys = Object.keys(ys).map(Number).sort(function (a, b) { return a - b; });
  // 도면으로 보여 줄 높이 고르기 (최대 6개)
  var picks = [];
  if (keys.length <= 6) picks = keys;
  else { var st = (keys.length - 1) / 5; for (var i = 0; i < 6; i++) picks.push(keys[Math.round(i * st)]); }
  picks = picks.filter(function (v, i, a) { return a.indexOf(v) === i; });

  var used = {}; bl.forEach(function (b) { used[b[3]] = 1; });
  var mats = Object.keys(used).filter(function (k) { return B[k]; }).slice(0, 14).map(function (k) {
    return '<span class="mt"><i style="background:' + B[k][0] + '"></i>' + B[k][1] + '</span>';
  }).join('');

  var floors = picks.map(function (y) {
    var label = (y < 0) ? ('지하 ' + (-y) + '칸') : ('높이 ' + y + '칸');
    return '<div class="fl"><div class="ft">' + label + '</div>' + planAt(bl, y, 13) + '</div>';
  }).join('');

  document.getElementById('sheet').innerHTML =
    '<button class="close" id="cls">✕ 닫기</button>' +
    '<h3>' + it.n + '</h3>' +
    '<div class="meta">' + it.sz + ' · 어려움 ' + stars(it.lv) + '</div>' +
    '<div class="panes"><div class="pane" style="flex:1 1 420px"><div class="pt">완성한 모습</div>' + iso(bl, { w: 15, hh: 11.5, max: 520 }) + '</div>' +
    '<div class="pane" style="flex:1 1 420px"><div class="pt">층별 도면 (위에서 본 모습)</div><div class="floors">' + floors + '</div></div></div>' +
    '<div class="tipbox">💡 ' + it.tip + '</div>' +
    '<div class="mats">' + mats + '</div>';
  document.getElementById('modal').classList.add('on');
  document.getElementById('cls').onclick = close;
  document.body.style.overflow = 'hidden';
}
function close() { document.getElementById('modal').classList.remove('on'); document.body.style.overflow = ''; }
document.getElementById('modal').onclick = function (e) { if (e.target.id === 'modal') close(); };
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });

render();
</script>
